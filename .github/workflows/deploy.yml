name: Deploy Eutardigrada.YOCKOW.jp
on:
  workflow_run:
    workflows:
      - Test Eutardigrada.YOCKOW.jp
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag-name:
        description: "A tag for deployed image."
        required: true
  push:
    tags:
      - "release-*"
permissions:
  packages: write
  contents: read
  attestations: write
  id-token: write
jobs:
  Define-Constants:
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository
        uses: actions/checkout@v6
      - name: Get Build Args
        id: get-build-args
        run: |
          echo "swift-version=$(cat .swift-version)" >>"$GITHUB_OUTPUT"
          echo "os-nickname=$(cat .swift-build-os)" >>"$GITHUB_OUTPUT"
      - name: Define Tag Name
        id: define-tag-name
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG_NAME: ${{ inputs.tag-name }}
        run: |
          case "$EVENT_NAME" in
          workflow_run)
            if [[ "$REF_NAME" == "main" ]]; then
              echo "tag-name=latest" >>"$GITHUB_OUTPUT"
            else
              echo "::error::Unexpected branch?!"
              exit 1
            fi
          ;;
          workflow_dispatch)
            if [[ -z "$INPUT_TAG_NAME" ]]; then
              echo "::error::Missing tag name?!"
              exit 1
            fi
            echo "tag-name=$INPUT_TAG_NAME" >>"$GITHUB_OUTPUT"
          ;;
          push)
            if [[ "$REF_TYPE" == "tag" ]]; then
              echo "tag-name=$REF_NAME" >>"$GITHUB_OUTPUT"
            else
              echo "::error::Unexpected ref type?!"
              exit 1
            fi
          ;;
          *)
            echo "::error::Unexpected event name?!"
            exit 1
          ;;
          esac
      - name: Calculate Hash
        id: calculate-hash
        env:
          SWIFT_FILES_HASH: ${{ hashFiles('CGISources/**/*.swift') }}
        run: |
          echo "swift-files-hash=${SWIFT_FILES_HASH}" >>"$GITHUB_OUTPUT"
    outputs:
      swift-version: ${{ steps.get-build-args.outputs.swift-version }}
      os-nickname: ${{ steps.get-build-args.outputs.os-nickname }}
      tag-name: ${{ steps.define-tag-name.outputs.tag-name }}
      swift-files-hash: ${{ steps.calculate-hash.outputs.swift-files-hash }}
  Deploy:
    needs:
      - Define-Constants
    uses: YOCKOW/DockerSwiftApacheCombination/.github/workflows/reusable_build-multiplatform-image.yml@main
    with:
      force-build: true
      build-args: |
        SWIFT_VERSION=${{ needs.Define-Constants.outputs.swift-version }}
        OS_NICKNAME=${{ needs.Define-Constants.outputs.os-nickname }}
      registry: ghcr.io
      username: ${{ github.actor }}
      image-basename: eutardigrada.yockow.jp
      tags: ${{ needs.Define-Constants.outputs.tag-name }}
      cache-file-path: .swift-scratch
      cache-file-key-suffix: ${{ needs.Define-Constants.outputs.os-nickname }}-${{ needs.Define-Constants.outputs.swift-version }}-${{ needs.Define-Constants.outputs.swift-files-hash }}
      set-up-command: >-
        sudo apt-get update &&
        sudo apt-get install --no-install-recommends -y zsh &&
        ./utils/swift-pre-build --configuration debug &&
        ./utils/swift-pre-build --configuration debug --test &&
        ./utils/swift-pre-build --configuration release
      push: true
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}
